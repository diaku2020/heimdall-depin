<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background Gradient: Deep Regal Purple to Radiant Amber Gold -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Metamaterial Core Amber Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Radar Pulse Waves Glow -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base / Token Frame -->
  <rect x="1" y="1" width="30" height="30" rx="8" ry="8" fill="url(#bgGrad)" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.5"/>

  <!-- Concentric Radar Wave Arcs (Sub-terahertz propagation) -->
  <!-- Outer Wave Arc -->
  <path d="M 6.5 16 A 9.5 9.5 0 0 1 25.5 16" fill="none" stroke="#00f3ff" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75"/>
  <path d="M 6.5 16 A 9.5 9.5 0 0 0 25.5 16" fill="none" stroke="#00f3ff" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Mid Wave Arc -->
  <path d="M 9.5 16 A 6.5 6.5 0 0 1 22.5 16" fill="none" stroke="#fef08a" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M 9.5 16 A 6.5 6.5 0 0 0 22.5 16" fill="none" stroke="#fef08a" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- The Iconic Bold HEIMDALL "H" Monogram (Fused with Dielectric Antenna Stems) -->
  <!-- Left Pillar -->
  <rect x="10.5" y="8" width="2.8" height="16" rx="1.2" fill="#ffffff"/>
  <!-- Right Pillar -->
  <rect x="18.7" y="8" width="2.8" height="16" rx="1.2" fill="#ffffff"/>
  <!-- Center Horizontal Bridge -->
  <rect x="10.5" y="14.4" width="11" height="3.2" rx="1" fill="#ffffff"/>

  <!-- Central Amber Metamaterial Lens Pupil -->
  <circle cx="16" cy="16" r="3.2" fill="url(#coreGlow)" stroke="#ffffff" stroke-width="0.9"/>
  <!-- Micro focal point -->
  <circle cx="16" cy="16" r="1.1" fill="#ffffff"/>
</svg>
